name = "numbered-preview-review"
main = "worker/index.js"
compatibility_date = "2026-01-28"
preview_urls = true
routes = [
  { pattern = "dev.jpcuuts.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
INITIAL_ADMIN_EMAIL = "skidmore@parabolos.com"
PUBLIC_ORIGIN = "https://dev.jpcuuts.com"
PUBLIC_SITE_HOSTS = ""
RESET_EMAIL_FROM = "JP Cuts Preview <jpcuuts@parabolos.com>"
CONTACT_EMAIL_FROM = "JP Cuts preview <jpcuuts@parabolos.com>"
CONTACT_EMAIL_TO = "jp@jpcuuts.com"

[[d1_databases]]
binding = "DB"
database_name = "numbered-preview-dev-db"
database_id = "d9484bc8-f95c-41e1-af34-ff3345bffa2f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "numbered-preview-dev-media"
